[project]
name = "allot-analysis"
version = "0.1.0"
description = "Site-local MRI integrity checks for the Allot public-data demo"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.11.2",
    "nibabel==5.4.2",
    "numpy==2.4.6",
    "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
